# abcd CI: the DJ brain's unit tests (pure Kotlin, no device needed) on every push to main and every pull request.
# Upstream's workflows were removed: they ran on paid Blacksmith runners and built iOS/desktop releases abcd does not ship.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dj-tests:
    name: DJ unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # --no-scan: never publish a Gradle build scan (the settings would otherwise do so on CI).
      - run: ./gradlew :dj-core:jvmTest --no-scan --console=plain
